name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '44 20 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
