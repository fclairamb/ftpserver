name: Test the docker image

on:
  schedule:
    # We want to check the published image every day
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - Dockerfile*
      - .dockerignore
      - .github/workflows/docker-test.yml
  workflow_dispatch:

jobs:
  test-docker-image:
    strategy:
      fail-fast: false
      matrix:
        tag: ["latest", "alpine"]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      SERVER_PORT: 2121
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'

      - name: Build the image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t "fclairamb/ftpserver:${{ matrix.tag }}" \
            -f "Dockerfile${{ matrix.tag == 'alpine' && '.alpine' || '' }}" .

      - name: Check that the image runs as a non-root user
        if: github.event_name == 'pull_request'
        run: |
          USER_ID="$(docker inspect --format '{{.Config.User}}' "fclairamb/ftpserver:${{ matrix.tag }}")"
          test "${USER_ID}" = "65532:65532"

      # The auto-created config file has a random password: we use our own config file, which also works with the
      # published images built before that change
      - name: Create the config file
        run: |
          FTP_PASS="$(head -c 18 /dev/urandom | base64 | tr -d '/+=')"
          echo "::add-mask::${FTP_PASS}"
          echo "FTP_PASS=${FTP_PASS}" >> "$GITHUB_ENV"
          mkdir -p conf
          cat > conf/ftpserver.json <<EOF
          {
            "version": 1,
            "accesses": [
              {
                "user": "test",
                "pass": "${FTP_PASS}",
                "fs": "os",
                "params": {
                  "basePath": "/tmp"
                }
              }
            ],
            "passive_transfer_port_range": {
              "start": 2122,
              "end": 2130
            }
          }
          EOF

      - name: Start the server
        run: |
          docker run -d --name ftpserver -p 2121-2130:2121-2130 -v "$(pwd)/conf:/conf:ro" \
            "fclairamb/ftpserver:${{ matrix.tag }}" -conf /conf/ftpserver.json

      - name: Upload and download a file
        run: |
          set -xe

          # Generating a file
          head -c 2097152 /dev/urandom > local.bin

          # Waiting for server to be ready
          timeout 30 sh -c "while ! nc -z localhost ${SERVER_PORT} </dev/null; do sleep 1; done"

          # Upload a file
          curl -v -T local.bin "ftp://test:${FTP_PASS}@localhost:${SERVER_PORT}/remote.bin"

          # Download it back
          curl -v "ftp://test:${FTP_PASS}@localhost:${SERVER_PORT}/remote.bin" -o remote.bin

          # Comparing file contents
          cmp local.bin remote.bin

      - name: Server logs
        if: always()
        run: docker logs ftpserver
