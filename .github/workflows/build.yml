name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3

      - name: Linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -v ./...
