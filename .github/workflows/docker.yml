name: Build docker images

# Images are published when a release is created. Releases are cut by release-please with the default
# GITHUB_TOKEN, whose events never trigger another workflow, so release-please.yml calls this workflow
# directly (see #1738). Pull requests only check that the images still build.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag of the release to build the images for'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to build the images for (e.g. v0.16.3)'
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - Dockerfile*
      - .dockerignore
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        type: ["", "alpine"]
    runs-on: ubuntu-26.04
    env:
      PUSH: ${{ github.repository == 'fclairamb/ftpserver' && github.event_name != 'pull_request' }}
    steps:
      - name: Resolve tag
        id: tag
        # `inputs` is empty on a tag push, in which case the ref is the tag itself.
        run: |
          tag='${{ inputs.tag }}'
          if [ -z "${tag}" ] && [ '${{ github.ref_type }}' = 'tag' ]; then
            tag='${{ github.ref_name }}'
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag || github.sha }}

      - name: Resolve build info
        id: build
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            fclairamb/ftpserver
            ghcr.io/fclairamb/ftpserver
          flavor: |
            suffix=${{ matrix.type != '' && format('-{0}', matrix.type) || '' }}
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.tag }}
            type=semver,suffix=,pattern=${{ matrix.type != '' && matrix.type || 'latest' }},value=${{ steps.tag.outputs.tag }}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile${{ matrix.type != '' && format('.{0}', matrix.type) || '' }}
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag || 'dev' }}
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=docker${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=docker${{ matrix.type }}
